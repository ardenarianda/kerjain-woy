<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerjain Woy! Pro 🔥</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font INTER: Lebih tajam dan tegas untuk layar laptop -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9; 
            --primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --dark: #0f172a; /* Teks lebih gelap agar tajam */
            --gray: #475569; /* Abu-abu lebih kontras */
            --danger: #dc2626; 
            --warning: #f59e0b; 
            --success: #16a34a;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--dark); 
            padding: 20px; 
            font-size: 13px; 
            font-weight: 500; 
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { font-size: 26px; font-weight: 800; background: var(--primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }

        /* TRIPLE GRID */
        .dashboard-wrapper { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) {
            .dashboard-wrapper { grid-template-columns: 220px 1fr 300px; align-items: start; }
        }

        /* NAVIGATION KIRI */
        .client-nav { display: flex; flex-direction: row; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
        @media (min-width: 1024px) { .client-nav { flex-direction: column; position: sticky; top: 20px; } }
        .nav-item { 
            padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; 
            transition: 0.2s; white-space: nowrap; border: 1.5px solid #e2e8f0; background: white; color: var(--gray);
        }
        .nav-item.active { background: var(--dark); color: white; border-color: var(--dark); }

        /* WORKSPACE TENGAH */
        .workspace { min-width: 0; }

        /* SIDEBAR KANAN */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 1024px) { .sidebar { position: sticky; top: 20px; } }
        .sidebar-card { background: white; border-radius: var(--radius); padding: 20px; border: 1.5px solid #e2e8f0; }
        
        /* ANALOG CLOCK */
        .clock-box { display: flex; flex-direction: column; align-items: center; background: #0f172a; color: white; border: none; }
        .clock { width: 90px; height: 90px; border: 3px solid white; border-radius: 50%; position: relative; margin-bottom: 10px; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: white; }
        .hour { width: 3px; height: 20px; } .min { width: 2px; height: 30px; } .sec { width: 1px; height: 35px; background: #ef4444; }

        /* CARDS */
        .card { 
            background: white; border-radius: var(--radius); border: 1.5px solid #e2e8f0; 
            margin-bottom: 12px; transition: 0.2s; overflow: hidden; position: relative; 
        }
        
        /* GRADING LOGIC: Tebal dan Tegas */
        .grading-yellow { border-left: 12px solid var(--warning) !important; }
        .grading-red { border-left: 12px solid var(--danger) !important; }
        .grading-complete { border-left: 12px solid var(--success) !important; }

        .card-header { padding: 18px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .project-title { font-weight: 800; font-size: 16px; color: var(--dark); }
        .project-meta { font-size: 11px; color: var(--gray); margin-top: 4px; display: flex; gap: 12px; font-weight: 600; }
        
        .card-body { display: none; padding: 0 20px 24px 20px; border-top: 1.5px solid #f1f5f9; background: #fcfdfe; }
        .card.expanded .card-body { display: block; }
        .inner-content { max-width: 700px; }

        .item-row { 
            display: grid; grid-template-columns: auto 1fr auto; align-items: center; 
            gap: 12px; padding: 10px 14px; background: white; border-radius: 10px; 
            margin-bottom: 6px; border: 1.5px solid #f1f5f9; font-weight: 600;
        }
        .inv-row { grid-template-columns: 1.4fr 1.2fr auto auto; }
        .text-content.done { text-decoration: line-through; color: #94a3b8; }

        /* BUTTONS & INPUTS */
        .btn { cursor: pointer; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 12px; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-p { background: var(--dark); color: white; }
        .btn-ghost { background: #f1f5f9; color: var(--gray); border: 1px solid #e2e8f0; }
        
        input, textarea { 
            width: 100%; padding: 10px 14px; border-radius: 10px; 
            border: 2px solid #e2e8f0; font-size: 13px; font-family: 'Inter', sans-serif; 
            color: var(--dark); font-weight: 600; 
        }
        input:focus { border-color: #4f46e5; outline: none; }

        .badge { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; }
        .pending { background: #fee2e2; color: #991b1b; }
        .paid { background: #dcfce7; color: #166534; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.6); z-index: 1000; justify-content:center; align-items:center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 95%; max-width: 450px; }
        
        .client-header { font-size: 11px; font-weight: 800; color: #6366f1; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .client-header::after { content: ""; flex: 1; height: 1.5px; background: #e2e8f0; }
    </style>
</head>
<body>

<div id="progress-bar" style="height: 3px; background: #4f46e5; position: fixed; top:0; left:0; width:0; transition: 0.4s; z-index: 9999;"></div>

<div class="container">
    <header>
        <h1>Kerjain Woy! 🔥</h1>
        <div style="display:flex; gap:10px">
            <button class="btn btn-ghost" id="toggleShowBtn" onclick="toggleShowCompleted()">Show Done</button>
            <button class="btn btn-p" onclick="openModal()">+ New Project</button>
        </div>
    </header>

    <div class="dashboard-wrapper">
        <!-- GRID 1: CLIENT NAV -->
        <div class="client-nav" id="clientNav"></div>

        <!-- GRID 2: MAIN WORKSPACE -->
        <div class="workspace">
            <div id="projectList"></div>
        </div>

        <!-- GRID 3: SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-card clock-box">
                <div class="clock">
                    <div class="hand hour" id="hourHand"></div>
                    <div class="hand min" id="minHand"></div>
                    <div class="hand sec" id="secHand"></div>
                </div>
                <div id="digitalTime" style="font-weight: 800; font-size: 15px; letter-spacing: 1px;">00:00:00</div>
            </div>

            <div class="sidebar-card">
                <div style="font-size: 10px; font-weight: 800; color: var(--gray); text-transform: uppercase;">💰 Money Overview</div>
                <div style="display:grid; grid-template-columns: 1fr; gap:10px; margin-top:12px">
                    <div style="background:#f8fafc; padding:12px; border-radius:10px">
                        <div style="font-size:9px; color:var(--gray); font-weight:800">TOTAL PAID</div>
                        <div id="totalPaid" style="font-weight:800; font-size:14px; color:var(--success)">0</div>
                    </div>
                    <div style="background:#f8fafc; padding:12px; border-radius:10px">
                        <div style="font-size:9px; color:var(--gray); font-weight:800">TOTAL PENDING</div>
                        <div id="totalPending" style="font-weight:800; font-size:14px; color:var(--danger)">0</div>
                    </div>
                </div>
            </div>

            <div class="sidebar-card">
                <div style="font-size: 10px; font-weight: 800; color: var(--gray); text-transform: uppercase;">⚠️ Urgent Projects</div>
                <div id="urgentFeed" style="margin-top:12px; font-size:12px; font-weight:700; color:var(--gray)">All clear!</div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Create Project -->
<div id="projectModal" class="modal">
    <div class="modal-content">
        <h2 style="font-weight:800; margin-bottom:20px; font-size:20px">New Project 🚀</h2>
        <input type="text" id="pName" placeholder="Nama Project">
        <input type="text" id="pClient" placeholder="Nama Client" style="margin-top:10px">
        <div style="display:flex; gap:10px; margin-top:15px">
            <div style="flex:1"><label style="font-size:10px;font-weight:800;color:var(--gray)">START DATE</label><input type="date" id="pStart"></div>
            <div style="flex:1"><label style="font-size:10px;font-weight:800;color:var(--gray)">END DATE</label><input type="date" id="pEnd"></div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:30px">
            <button class="btn btn-ghost" onclick="document.getElementById('projectModal').style.display='none'">Cancel</button>
            <button class="btn btn-p" onclick="createProject()">Create Project</button>
        </div>
    </div>
</div>

<!-- Modal Edit Task -->
<div id="editTaskModal" class="modal"><div class="modal-content">
    <h3 style="font-weight:800; margin-bottom:15px">Edit Task</h3>
    <input type="text" id="editTaskText">
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px">
        <button class="btn btn-ghost" onclick="document.getElementById('editTaskModal').style.display='none'">Cancel</button>
        <button class="btn btn-p" id="saveEditTaskBtn">Update</button>
    </div>
</div></div>

<!-- Modal Edit Inv -->
<div id="editInvModal" class="modal"><div class="modal-content">
    <h3 style="font-weight:800; margin-bottom:15px">Edit Termin</h3>
    <input type="text" id="editInvLabel" style="margin-bottom:10px">
    <input type="text" id="editInvAmount" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')">
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px">
        <button class="btn btn-ghost" onclick="document.getElementById('editInvModal').style.display='none'">Cancel</button>
        <button class="btn btn-p" id="saveEditInvBtn">Update</button>
    </div>
</div></div>

<script>
    const SB_URL = "https://zpzsholzfgrgobiahnux.supabase.co"; 
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwenNob2x6ZmdyZ29iaWFobnV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MDU3ODEsImV4cCI6MjEwMTk4MTc4MX0.NHmyUkUEUrLc_-8hFwiksQDq4fwvR3z2d5W0dTgi5BE"; 
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let projects = [];
    let filterClient = "All Projects";
    let showCompleted = false;

    // Analog Clock
    setInterval(() => {
        const now = new Date();
        document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${now.getSeconds() * 6}deg)`;
        document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${now.getMinutes() * 6}deg)`;
        document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${now.getHours() * 30 + now.getMinutes() / 2}deg)`;
        document.getElementById('digitalTime').innerText = now.toLocaleTimeString('en-GB');
    }, 1000);

    const loader = (s) => document.getElementById('progress-bar').style.width = s ? '60%' : '0%';
    
    // RESET FORM SAAT BUKA MODAL
    const openModal = () => {
        document.getElementById('pName').value = ""; 
        document.getElementById('pClient').value = "";
        document.getElementById('pStart').value = ""; 
        document.getElementById('pEnd').value = "";
        document.getElementById('projectModal').style.display = 'flex';
    };

    const formatRupiah = (a) => !a ? "0" : new Intl.NumberFormat('id-ID').format(a);

    async function loadData() {
        loader(true);
        const { data, error } = await sb.from('projects').select('*').order('created_at', { ascending: false });
        if (!error) { 
            const exp = projects.filter(p => p.expanded).map(p => p.id);
            projects = data.map(p => ({ ...p, expanded: exp.includes(p.id) })); 
            renderNav(); render(); updateSummary();
        }
        loader(false);
    }

    function renderNav() {
        const nav = document.getElementById('clientNav');
        const clients = ["All Projects", ...new Set(projects.map(p => p.client || "No Client"))];
        nav.innerHTML = clients.map(c => `
            <div class="nav-item ${filterClient === c ? 'active' : ''}" onclick="filterClient='${c}'; renderNav(); render();">
                ${c}
            </div>
        `).join('');
    }

    async function createProject() {
        const name = document.getElementById('pName').value;
        if (!name) return alert("Nama project wajib diisi!");
        await sb.from('projects').insert([{
            name, client: document.getElementById('pClient').value || "No Client",
            start_date: document.getElementById('pStart').value, end_date: document.getElementById('pEnd').value,
            is_completed: false, tasks: [], invoices: [], notes: ""
        }]);
        document.getElementById('projectModal').style.display='none'; 
        loadData();
    }

    function updateSummary() {
        let paid = 0, pending = 0, urgents = [];
        const today = new Date().setHours(0,0,0,0);
        projects.forEach(p => {
            p.invoices.forEach(i => { if(i.status==='Paid') paid+=parseInt(i.amount); else pending+=parseInt(i.amount); });
            if(!p.is_completed && p.reminder_date) {
                const diff = Math.ceil((new Date(p.reminder_date) - today) / 86400000);
                if(diff <= 10) urgents.push(p.name);
            }
        });
        document.getElementById('totalPaid').innerText = "IDR " + formatRupiah(paid);
        document.getElementById('totalPending').innerText = "IDR " + formatRupiah(pending);
        document.getElementById('urgentFeed').innerText = urgents.length ? urgents.join(', ') : "No urgent projects.";
    }

    // FUNGSI GRADING DENGAN LOGIKA TANGGAL YANG BENAR
    function getGradingClass(p) {
        if (p.is_completed) return 'grading-complete';
        if (!p.reminder_date) return '';
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const remindDate = new Date(p.reminder_date);
        remindDate.setHours(0, 0, 0, 0);
        
        const diffTime = remindDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays <= 0) return 'grading-red';
        if (diffDays <= 10) return 'grading-yellow';
        return '';
    }

    function render() {
        const container = document.getElementById('projectList');
        let filtered = projects.filter(p => showCompleted ? true : !p.is_completed);
        if (filterClient !== "All Projects") filtered = filtered.filter(p => (p.client || "No Client") === filterClient);
        
        if(!filtered.length) { container.innerHTML = `<div style="text-align:center; padding:40px; color:gray">No projects found.</div>`; return; }

        const grouped = filtered.reduce((acc, p) => {
            const c = p.client || "No Client";
            if (!acc[c]) acc[c] = []; acc[c].push(p); return acc;
        }, {});

        let html = "";
        for (const client in grouped) {
            html += `<div class="client-group"><div class="client-header">${client}</div>`;
            html += grouped[client].map(p => `
                <div class="card ${p.expanded ? 'expanded' : ''} ${getGradingClass(p)}">
                    <div class="card-header" onclick="projects.find(x=>x.id==='${p.id}').expanded=!projects.find(x=>x.id==='${p.id}').expanded; render();">
                        <div>
                            <div class="project-title">${p.is_completed ? '✅ ' : ''}${p.name}</div>
                            <div class="project-meta">
                                <span>📅 ${p.start_date || '-'} s/d ${p.end_date || '-'}</span>
                                ${p.reminder_date ? `<span style="color:var(--dark); font-weight:800">🔔 Remind: ${p.reminder_date}</span>` : ''}
                            </div>
                        </div>
                        <div style="font-size:12px; color:var(--gray)">${p.expanded ? '▲' : '▼'}</div>
                    </div>
                    <div class="card-body">
                        <div class="inner-content">
                            <div style="font-size:10px; font-weight:800; color:var(--gray); text-transform:uppercase; margin-bottom:5px">⏰ Set Reminder Date</div>
                            <input type="date" value="${p.reminder_date || ''}" onchange="sb.from('projects').update({reminder_date:this.value}).eq('id','${p.id}').then(()=>loadData())" style="max-width:180px">

                            <div style="font-size:10px; font-weight:800; color:var(--gray); text-transform:uppercase; margin:20px 0 8px 0">📌 Checklist Tasks</div>
                            ${p.tasks.map(t => `
                                <div class="item-row">
                                    <input type="checkbox" style="width:18px;height:18px" ${t.done ? 'checked' : ''} onchange="toggleTask('${p.id}','${t.id}')">
                                    <span class="text-content ${t.done ? 'done' : ''}">${t.text}</span>
                                    <div style="display:flex; gap:4px">
                                        <button class="btn btn-ghost" style="padding:4px 8px" onclick="openEditTaskModal('${p.id}','${t.id}')">✎</button>
                                        <button class="btn btn-ghost" style="padding:4px 8px" onclick="deleteTask('${p.id}','${t.id}')">×</button>
                                    </div>
                                </div>
                            `).join('')}
                            <div style="display:flex; gap:8px; margin-top:8px">
                                <input type="text" id="tIn-${p.id}" placeholder="Tambah tugas...">
                                <button class="btn btn-p" onclick="addTask('${p.id}')">Add</button>
                            </div>

                            <div style="font-size:10px; font-weight:800; color:var(--gray); text-transform:uppercase; margin:20px 0 8px 0">💸 Invoicing</div>
                            ${p.invoices.map(i => `
                                <div class="item-row inv-row">
                                    <span style="font-weight:700">${i.label}</span>
                                    <span style="color:#4f46e5; font-weight:800">IDR ${formatRupiah(i.amount)}</span>
                                    <span class="badge ${i.status.toLowerCase()}" onclick="toggleInvStatus('${p.id}','${i.id}')">${i.status}</span>
                                    <div style="display:flex; gap:4px">
                                        <button class="btn btn-ghost" style="padding:4px 8px" onclick="openEditInvModal('${p.id}','${i.id}')">✎</button>
                                        <button class="btn btn-ghost" style="padding:4px 8px" onclick="deleteInv('${p.id}','${i.id}')">×</button>
                                    </div>
                                </div>
                            `).join('')}
                            <div style="display:flex; gap:8px; margin-top:8px">
                                <input type="text" id="iL-${p.id}" placeholder="Label" style="flex:1.5">
                                <input type="text" id="iA-${p.id}" placeholder="Nominal" style="flex:1" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')">
                                <button class="btn btn-p" onclick="addInv('${p.id}')">Save</button>
                            </div>

                            <div style="font-size:10px; font-weight:800; color:var(--gray); text-transform:uppercase; margin:20px 0 8px 0">📝 Notes</div>
                            <textarea onblur="sb.from('projects').update({notes:this.value}).eq('id','${p.id}')">${p.notes || ''}</textarea>

                            <div style="display:flex; justify-content:space-between; margin-top:25px">
                                <button class="btn btn-ghost" style="color:var(--danger)" onclick="if(confirm('Hapus?')) sb.from('projects').delete().eq('id', '${p.id}').then(()=>loadData())">Delete</button>
                                <button class="btn ${p.is_completed ? 'btn-ghost' : 'btn-p'}" onclick="sb.from('projects').update({is_completed:!${p.is_completed}}).eq('id','${p.id}').then(()=>loadData())">
                                    ${p.is_completed ? 'Re-open' : 'Complete ✅'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`).join('');
            html += `</div>`;
        }
        container.innerHTML = html;
    }

    // LOGIKA TAMBAH/EDIT/HAPUS (Disederhanakan agar stabil)
    async function addTask(pId) {
        const v = document.getElementById(`tIn-${pId}`).value; if(!v) return;
        const p = projects.find(x=>x.id===pId);
        p.tasks.push({id:Date.now(), text:v, done:false});
        await sb.from('projects').update({tasks:p.tasks}).eq('id',pId); loadData();
    }
    async function toggleTask(pId, tId) {
        const p = projects.find(x=>x.id===pId);
        const t = p.tasks.find(x=>x.id.toString()===tId.toString());
        t.done = !t.done; await sb.from('projects').update({tasks:p.tasks}).eq('id',pId); render();
    }
    async function deleteTask(pId, tId) {
        const p = projects.find(x=>x.id===pId);
        p.tasks = p.tasks.filter(x=>x.id.toString()!==tId.toString());
        await sb.from('projects').update({tasks:p.tasks}).eq('id',pId); render();
    }
    async function addInv(pId) {
        const l = document.getElementById(`iL-${pId}`).value, a = document.getElementById(`iA-${pId}`).value; if(!l||!a) return;
        const p = projects.find(x=>x.id===pId);
        p.invoices.push({id:Date.now(), label:l, amount:a.replace(/\./g,''), status:'Pending'});
        await sb.from('projects').update({invoices:p.invoices}).eq('id',pId); loadData();
    }
    async function toggleInvStatus(pId, iId) {
        const p = projects.find(x=>x.id===pId);
        const i = p.invoices.find(x=>x.id.toString()===iId.toString());
        i.status = i.status === 'Pending' ? 'Paid' : 'Pending';
        await sb.from('projects').update({invoices:p.invoices}).eq('id',pId); loadData();
    }
    async function deleteInv(pId, iId) {
        const p = projects.find(x=>x.id===pId);
        p.invoices = p.invoices.filter(x=>x.id.toString()!==iId.toString());
        await sb.from('projects').update({invoices:p.invoices}).eq('id',pId); loadData();
    }

    // Modal Edit Boilerplate
    let curEdit = {};
    function openEditTaskModal(pId, tId) {
        const t = projects.find(x=>x.id===pId).tasks.find(x=>x.id.toString()===tId.toString());
        curEdit = {pId, tId}; document.getElementById('editTaskText').value = t.text;
        document.getElementById('editTaskModal').style.display='flex';
        document.getElementById('saveEditTaskBtn').onclick = async () => {
            const p = projects.find(x=>x.id===curEdit.pId);
            p.tasks.find(x=>x.id.toString()===curEdit.tId.toString()).text = document.getElementById('editTaskText').value;
            await sb.from('projects').update({tasks:p.tasks}).eq('id',curEdit.pId);
            document.getElementById('editTaskModal').style.display='none'; render();
        }
    }
    function openEditInvModal(pId, iId) {
        const i = projects.find(x=>x.id===pId).invoices.find(x=>x.id.toString()===iId.toString());
        curEdit = {pId, iId}; document.getElementById('editInvLabel').value = i.label;
        document.getElementById('editInvAmount').value = formatRupiah(i.amount);
        document.getElementById('editInvModal').style.display='flex';
        document.getElementById('saveEditInvBtn').onclick = async () => {
            const p = projects.find(x=>x.id===curEdit.pId);
            const inv = p.invoices.find(x=>x.id.toString()===curEdit.iId.toString());
            inv.label = document.getElementById('editInvLabel').value;
            inv.amount = document.getElementById('editInvAmount').value.replace(/\./g,'');
            await sb.from('projects').update({invoices:p.invoices}).eq('id',curEdit.pId);
            document.getElementById('editInvModal').style.display='none'; loadData();
        }
    }

    function toggleShowCompleted() { showCompleted = !showCompleted; document.getElementById('toggleShowBtn').innerText = showCompleted ? "Hide Done" : "Show Done"; render(); }

    loadData();
</script>
</body>
</html>
