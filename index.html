<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerjain Woy! Pro 🔥</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9; --primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --dark: #0f172a; --gray: #475569; --danger: #dc2626; 
            --warning: #f59e0b; --success: #16a34a; --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--dark); padding: 20px; font-size: 13px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 26px; font-weight: 800; background: var(--primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .view-switcher { display: flex; background: #e2e8f0; padding: 4px; border-radius: 10px; margin-bottom: 20px; width: fit-content; }
        .view-btn { padding: 8px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 800; font-size: 11px; color: var(--gray); transition: 0.2s; }
        .view-btn.active { background: white; color: var(--dark); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .dashboard-wrapper { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .dashboard-wrapper { grid-template-columns: 220px 1fr 320px; align-items: start; } }
        .client-nav { display: flex; flex-direction: row; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
        @media (min-width: 1024px) { .client-nav { flex-direction: column; position: sticky; top: 20px; } }
        .nav-item { padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; border: 1.5px solid #e2e8f0; background: white; color: var(--gray); white-space: nowrap; }
        .nav-item.active { background: var(--dark); color: white; border-color: var(--dark); }
        .card { background: white; border-radius: var(--radius); border: 1.5px solid #e2e8f0; margin-bottom: 12px; overflow: hidden; }
        .card-header { padding: 18px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .card-body { display: none; padding: 0 20px 24px 20px; border-top: 1.5px solid #f1f5f9; background: #fcfdfe; }
        .card.expanded .card-body { display: block; }
        .inner-content { max-width: 650px; }
        .item-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 14px; background: white; border-radius: 10px; margin-bottom: 6px; border: 1.5px solid #f1f5f9; font-weight: 600; }
        .inv-row { grid-template-columns: 1.4fr 1.2fr auto auto; }
        .doc-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr auto auto; align-items: center; gap: 15px; padding: 12px 18px; background: white; border-radius: 10px; border: 1.5px solid #e2e8f0; margin-bottom: 8px; position: relative; overflow: hidden; }
        .grading-yellow { border-left: 10px solid var(--warning) !important; }
        .grading-red { border-left: 10px solid var(--danger) !important; }
        .grading-complete { border-left: 10px solid var(--success) !important; }
        .sidebar-card { background: white; border-radius: var(--radius); padding: 20px; border: 1.5px solid #e2e8f0; margin-bottom: 20px; }
        .clock-box { display: flex; flex-direction: column; align-items: center; background: #0f172a; color: white; border: none; }
        .clock { width: 70px; height: 70px; border: 2px solid white; border-radius: 50%; position: relative; margin-bottom: 10px; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: white; }
        .hour { width: 3px; height: 15px; } .min { width: 2px; height: 22px; } .sec { width: 1px; height: 26px; background: #ef4444; }
        .btn { cursor: pointer; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; font-size: 11px; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-p { background: var(--dark); color: white; }
        .btn-ghost { background: #f1f5f9; color: var(--gray); border: 1px solid #e2e8f0; }
        input, textarea { width: 100%; padding: 10px 14px; border-radius: 10px; border: 2px solid #e2e8f0; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .pending { background: #fee2e2; color: #991b1b; } .paid { background: #dcfce7; color: #166534; }
        .status-ok { background: #dcfce7; color: #166534; } .status-expired { background: #fee2e2; color: #991b1b; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.6); z-index: 1000; justify-content:center; align-items:center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 95%; max-width: 450px; }
        .summary-box { background: #f8fafc; padding: 12px; border-radius: 10px; margin-top: 10px; border: 1px solid #f1f5f9; }
        #progress-bar { height: 3px; background: #4f46e5; position: fixed; top:0; left:0; width:0; z-index: 9999; }
    </style>
</head>
<body>

<div id="progress-bar"></div>

<div class="container">
    <header>
        <h1>Kerjain Woy! 🔥</h1>
        <div style="display:flex; gap:10px">
            <button class="btn btn-ghost" id="toggleShowBtn" onclick="toggleShowCompleted()">Show Done</button>
            <button class="btn btn-p" onclick="openModal('projectModal')">+ Project Baru</button>
        </div>
    </header>

    <div class="view-switcher">
        <button class="view-btn active" id="v-projects" onclick="switchView('projects')">PROJECTS</button>
        <button class="view-btn" id="v-docs" onclick="switchView('docs')">DOCUMENTS</button>
    </div>

    <div class="dashboard-wrapper">
        <div class="client-nav" id="clientNav"></div>
        <div class="workspace">
            <div id="projectList"></div>
            <div id="documentList" style="display:none"></div>
        </div>
        <div class="sidebar">
            <div class="sidebar-card clock-box">
                <div class="clock"><div class="hand hour" id="hourHand"></div><div class="hand min" id="minHand"></div><div class="hand sec" id="secHand"></div></div>
                <div id="digitalTime" style="font-weight: 800; font-size: 14px;">00:00:00</div>
            </div>
            <div class="sidebar-card">
                <div style="font-size: 10px; font-weight: 800; color: var(--gray); text-transform: uppercase;">💰 Cuan Tracker</div>
                <div class="summary-box">
                    <div style="font-size:8px; font-weight:800">TOTAL CUAN (ALL TIME)</div>
                    <div id="totalPaid" style="font-weight:800; font-size:16px; color:var(--success)">IDR 0</div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:10px">
                    <div style="background:#f0fdf4; padding:8px; border-radius:8px"><div style="font-size:7px; font-weight:800">BULAN INI</div><div id="monthPaid" style="font-weight:800; font-size:11px">0</div></div>
                    <div style="background:#f0fdf4; padding:8px; border-radius:8px"><div style="font-size:7px; font-weight:800">TAHUN INI</div><div id="yearPaid" style="font-weight:800; font-size:11px">0</div></div>
                </div>
                <div class="summary-box" style="border-color: #fee2e2;">
                    <div style="font-size:8px; font-weight:800">NYANGKUT (PENDING)</div>
                    <div id="totalPending" style="font-weight:800; font-size:14px; color:var(--danger)">IDR 0</div>
                </div>
            </div>
            <div class="sidebar-card">
                <div style="font-size: 10px; font-weight: 800; color: var(--gray); text-transform: uppercase;">⚠️ Alerts</div>
                <div id="urgentFeed" style="margin-top:10px; font-size:11px; color:var(--gray)">All clear...</div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Create Project -->
<div id="projectModal" class="modal"><div class="modal-content">
    <h2 style="font-weight:800; margin-bottom:15px">Gassken Project Baru! 🚀</h2>
    <input type="text" id="pName" placeholder="Nama Project">
    <input type="text" id="pClient" placeholder="Siapa Client-nya?" style="margin-top:10px">
    <div style="display:flex; gap:10px; margin-top:15px"><div style="flex:1"><label style="font-size:9px;font-weight:800">MULAI</label><input type="date" id="pStart"></div><div style="flex:1"><label style="font-size:9px;font-weight:800">DEADLINE</label><input type="date" id="pEnd"></div></div>
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:30px"><button class="btn btn-ghost" onclick="closeModal('projectModal')">Batal</button><button class="btn btn-p" onclick="createProject()">Sikat!</button></div>
</div></div>

<!-- Modal Document (Create & Edit) -->
<div id="docModal" class="modal"><div class="modal-content">
    <h2 id="docModalTitle" style="font-weight:800; margin-bottom:15px">Arsip Dokumen 📄</h2>
    <input type="text" id="dName" placeholder="Nama Dokumen (NIB, SIUP, dll)">
    <input type="text" id="dClient" placeholder="Punya Client Mana?" style="margin-top:10px">
    <div style="display:flex; gap:10px; margin-top:15px">
        <div style="flex:1"><label style="font-size:9px;font-weight:800">DARI</label><input type="date" id="dStart"></div>
        <div style="flex:1"><label style="font-size:9px;font-weight:800">SAMPAI (Opsional)</label><input type="date" id="dEnd"></div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:30px">
        <button class="btn btn-ghost" onclick="closeModal('docModal')">Batal</button>
        <button class="btn btn-p" id="saveDocBtn">Gassken!</button>
    </div>
</div></div>

<!-- Modal Edit (Task/Inv) -->
<div id="editTaskModal" class="modal"><div class="modal-content"><h3>Edit Tugas</h3><input type="text" id="editTaskText"><div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px"><button class="btn btn-ghost" onclick="closeModal('editTaskModal')">Batal</button><button class="btn btn-p" id="saveEditTaskBtn">Update Sip</button></div></div></div>
<div id="editInvModal" class="modal"><div class="modal-content"><h3>Edit Termin</h3><input type="text" id="editInvLabel" style="margin-bottom:10px"><input type="text" id="editInvAmount" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')"><div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px"><button class="btn btn-ghost" onclick="closeModal('editInvModal')">Batal</button><button class="btn btn-p" id="saveEditInvBtn">Update Sip</button></div></div></div>

<script>
    const SB_URL = "https://zpzsholzfgrgobiahnux.supabase.co"; 
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwenNob2x6ZmdyZ29iaWFobnV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MDU3ODEsImV4cCI6MjEwMTk4MTc4MX0.NHmyUkUEUrLc_-8hFwiksQDq4fwvR3z2d5W0dTgi5BE"; 
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let projects = [], documents = [], currentView = 'projects', filterClient = "All Projects", showCompleted = false;

    setInterval(() => {
        const d = new Date();
        document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${d.getSeconds()*6}deg)`;
        document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${d.getMinutes()*6}deg)`;
        document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${d.getHours()*30+d.getMinutes()/2}deg)`;
        document.getElementById('digitalTime').innerText = d.toLocaleTimeString('en-GB');
    }, 1000);

    const loader = (s) => document.getElementById('progress-bar').style.width = s ? '60%' : '0%';
    const formatRupiah = (a) => !a ? "0" : new Intl.NumberFormat('id-ID').format(a);
    const openModal = (id) => { 
        if(id === 'projectModal' || id === 'docModal') document.querySelectorAll(`#${id} input`).forEach(i => i.value = "");
        if(id === 'docModal') document.getElementById('saveDocBtn').onclick = createDoc;
        document.getElementById(id).style.display = 'flex'; 
    };
    const closeModal = (id) => document.getElementById(id).style.display = 'none';

    async function loadAll(keepExpanded = false) {
        loader(true);
        try {
            const { data: pData } = await sb.from('projects').select('*').order('created_at', { ascending: false });
            const { data: dData } = await sb.from('client_documents').select('*').order('created_at', { ascending: false });
            const currentExp = keepExpanded ? projects.filter(p => p.expanded).map(p => p.id) : [];
            projects = (pData || []).map(p => ({ ...p, expanded: currentExp.includes(p.id) }));
            documents = dData || [];
            renderNav(); render(); updateSummary();
        } catch (e) { console.error(e); }
        loader(false);
    }

    function switchView(v) {
        currentView = v;
        document.getElementById('v-projects').classList.toggle('active', v === 'projects');
        document.getElementById('v-docs').classList.toggle('active', v === 'docs');
        document.getElementById('projectList').style.display = v === 'projects' ? 'block' : 'none';
        document.getElementById('documentList').style.display = v === 'docs' ? 'block' : 'none';
        render();
    }

    function renderNav() {
        const nav = document.getElementById('clientNav');
        const cList = ["All Projects", ...new Set([...projects.map(p => p.client), ...documents.map(d => d.client)])].filter(Boolean);
        nav.innerHTML = cList.map(c => `<div class="nav-item ${filterClient === c ? 'active' : ''}" onclick="filterClient='${c}'; renderNav(); render();">${c}</div>`).join('');
    }

    async function createProject() {
        const n = document.getElementById('pName').value, c = document.getElementById('pClient').value || "No Client";
        if(!n) return alert("Nama wajib!");
        await sb.from('projects').insert([{ name:n, client:c, start_date:document.getElementById('pStart').value, end_date:document.getElementById('pEnd').value, tasks:[], invoices:[], is_completed:false }]);
        closeModal('projectModal'); loadAll();
    }

    async function createDoc() {
        const n = document.getElementById('dName').value, c = document.getElementById('dClient').value || "No Client";
        const sd = document.getElementById('dStart').value, ed = document.getElementById('dEnd').value || null;
        if(!n) return alert("Nama wajib!");
        await sb.from('client_documents').insert([{ doc_name:n, client:c, start_date:sd, end_date:ed }]);
        closeModal('docModal'); loadAll();
    }

    function updateSummary() {
        let tPaid = 0, tPend = 0, mPaid = 0, yPaid = 0, alerts = [];
        const now = new Date();
        projects.forEach(p => {
            (p.invoices || []).forEach(i => {
                const amt = parseInt(i.amount) || 0;
                if(i.status === 'Paid') {
                    tPaid += amt;
                    if(i.paid_at) {
                        const pd = new Date(i.paid_at);
                        if(pd.getMonth() === now.getMonth() && pd.getFullYear() === now.getFullYear()) mPaid += amt;
                        if(pd.getFullYear() === now.getFullYear()) yPaid += amt;
                    }
                } else tPend += amt;
            });
            if(!p.is_completed && p.reminder_date) {
                const diff = Math.ceil((new Date(p.reminder_date) - new Date().setHours(0,0,0,0)) / 86400000);
                if(diff <= 10) alerts.push(`<div class="urgent-item">Proj: ${p.name} (${diff <= 0 ? 'OVERDUE' : diff + 'd'})</div>`);
            }
        });
        documents.forEach(d => {
            if(d.end_date) {
                const diff = Math.ceil((new Date(d.end_date) - new Date().setHours(0,0,0,0)) / 86400000);
                if(diff <= 60) alerts.push(`<div class="urgent-item" style="border-left-color:${diff <= 30 ? 'var(--danger)' : 'var(--warning)'}">Doc: ${d.doc_name} (${diff <= 0 ? 'BASI' : diff + 'd'})</div>`);
            }
        });
        document.getElementById('totalPaid').innerText = "IDR " + formatRupiah(tPaid);
        document.getElementById('totalPending').innerText = "IDR " + formatRupiah(tPend);
        document.getElementById('monthPaid').innerText = "IDR " + formatRupiah(mPaid);
        document.getElementById('yearPaid').innerText = "IDR " + formatRupiah(yPaid);
        document.getElementById('urgentFeed').innerHTML = alerts.join('') || "Semua aman...";
    }

    function render() { if(currentView === 'projects') renderProjects(); else renderDocs(); }

    function renderProjects() {
        const container = document.getElementById('projectList');
        let filtered = projects.filter(p => showCompleted ? true : !p.is_completed);
        if(filterClient !== "All Projects") filtered = filtered.filter(p => p.client === filterClient);
        const grouped = filtered.reduce((acc, p) => { const c = p.client || "No Client"; if(!acc[c]) acc[c] = []; acc[c].push(p); return acc; }, {});
        let html = "";
        for(const client in grouped) {
            html += `<div class="client-group"><div class="client-header">${client}</div>`;
            html += grouped[client].map(p => `
                <div class="card ${p.expanded ? 'expanded' : ''} ${getGrading(p)}">
                    <div class="card-header" onclick="toggleCard('${p.id}')">
                        <div><div style="font-weight:800; font-size:15px">${p.is_completed?'✅ ':''}${p.name}</div><div style="font-size:11px; color:var(--gray)">📅 ${p.start_date || '-'} s/d ${p.end_date || '-'}</div></div>
                        <div style="font-size:12px">${p.expanded ? '▲' : '▼'}</div>
                    </div>
                    <div class="card-body"><div class="inner-content">
                        <label style="font-size:9px; font-weight:800; color:var(--gray)">⏰ SET REMINDER</label>
                        <input type="date" value="${p.reminder_date || ''}" onchange="sb.from('projects').update({reminder_date:this.value}).eq('id','${p.id}').then(()=>loadAll(true))" style="max-width:180px; margin-bottom:15px">
                        <div style="font-size:9px; font-weight:800; color:var(--gray)">📌 TASKS</div>
                        ${(p.tasks || []).map(t => `<div class="item-row"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${p.id}','${t.id}')"><span style="flex:1" class="${t.done?'text-content done':'text-content'}">${t.text}</span><div style="display:flex;gap:4px"><button class="btn btn-ghost" style="padding:4px 8px" onclick="openEditTaskModal('${p.id}','${t.id}')">✎</button><button class="btn btn-ghost" style="padding:4px 8px" onclick="deleteTask('${p.id}','${t.id}')">×</button></div></div>`).join('')}
                        <div style="display:flex; gap:8px; margin:10px 0"><input type="text" id="tIn-${p.id}" placeholder="Next step..."><button class="btn btn-p" onclick="addTask('${p.id}')">Sikat</button></div>
                        <div style="font-size:9px; font-weight:800; color:var(--gray)">💸 INVOICING</div>
                        ${(p.invoices || []).map(i => `<div class="item-row inv-row"><span style="font-weight:700">${i.label}</span><span style="color:#4f46e5; font-weight:800">IDR ${formatRupiah(i.amount)}</span><span class="badge ${i.status.toLowerCase()}" onclick="toggleInvStatus('${p.id}','${i.id}')">${i.status}</span><div style="display:flex; gap:4px"><button class="btn btn-ghost" style="padding:4px 8px" onclick="openEditInvModal('${p.id}','${i.id}')">✎</button><button class="btn btn-ghost" style="padding:4px 8px" onclick="deleteInv('${p.id}','${i.id}')">×</button></div></div>`).join('')}
                        <div style="display:flex; gap:8px; margin-top:10px"><input type="text" id="iL-${p.id}" placeholder="Label" style="flex:1.5"><input type="text" id="iA-${p.id}" placeholder="Nominal" style="flex:1" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')"><button class="btn btn-p" onclick="addInv('${p.id}')">Save</button></div>
                        <div style="display:flex; justify-content:space-between; margin-top:20px">
                            <button class="btn btn-ghost" style="color:var(--danger)" onclick="if(confirm('Hapus?')) sb.from('projects').delete().eq('id','${p.id}').then(()=>loadAll())">Hapus</button>
                            <button class="btn ${p.is_completed ? 'btn-ghost' : 'btn-p'}" onclick="sb.from('projects').update({is_completed:!${p.is_completed}}).eq('id','${p.id}').then(()=>loadAll())">${p.is_completed?'Buka Lagi':'Beres ✅'}</button>
                        </div>
                    </div></div>
                </div>`).join('');
            html += `</div>`;
        }
        container.innerHTML = html || "<div style='text-align:center; padding:40px; color:gray'>Belum ada project nih.</div>";
    }

    function renderDocs() {
        const container = document.getElementById('documentList');
        let filtered = documents;
        if(filterClient !== "All Projects") filtered = documents.filter(d => d.client === filterClient);
        let h = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px"><h3 style="font-weight:800">CLIENT DOCS 📂</h3><button class="btn btn-p" onclick="openModal('docModal')">+ Berkas Baru</button></div>`;
        h += filtered.map(d => {
            const today = new Date().setHours(0,0,0,0);
            let grading = '', statusTxt = 'Masih Idup', statusCls = 'status-ok';
            if(d.end_date) {
                const diff = Math.ceil((new Date(d.end_date) - today) / 86400000);
                if(diff <= 30) grading = 'grading-red', statusTxt = (diff <= 0 ? 'Sudah Basi' : 'Masih Idup'), statusCls = (diff <= 0 ? 'status-expired' : 'status-ok');
                else if(diff <= 60) grading = 'grading-yellow';
            }
            return `<div class="doc-row ${grading}">
                <div><div style="font-size:8px; color:var(--gray)">DOC</div><b>${d.doc_name}</b></div>
                <div><div style="font-size:8px; color:var(--gray)">CLIENT</div>${d.client}</div>
                <div><div style="font-size:8px; color:var(--gray)">VALIDITY</div>${d.start_date || '-'} to ${d.end_date || 'Lifetime'}</div>
                <div><span class="badge ${statusCls}">${statusTxt}</span></div>
                <div style="display:flex; gap:5px">
                    <button class="btn btn-ghost btn-sm-icon" onclick="openEditDocModal('${d.id}')">✎</button>
                    <button class="btn btn-ghost btn-sm-icon" style="color:var(--danger)" onclick="if(confirm('Hapus?')) sb.from('client_documents').delete().eq('id','${d.id}').then(()=>loadAll())">×</button>
                </div>
            </div>`;
        }).join('') || "<p style='color:gray;text-align:center;padding:40px'>Belum ada dokumen.</p>";
        container.innerHTML = h;
    }

    function toggleCard(id) { projects = projects.map(p => ({ ...p, expanded: p.id === id ? !p.expanded : false })); render(); }
    function toggleShowCompleted() { showCompleted = !showCompleted; document.getElementById('toggleShowBtn').innerText = showCompleted ? "Hide Done" : "Show Done"; render(); }
    function getGrading(p) { if(p.is_completed) return 'grading-complete'; if(!p.reminder_date) return ''; const diff = Math.ceil((new Date(p.reminder_date) - new Date().setHours(0,0,0,0)) / 86400000); return diff <= 0 ? 'grading-red' : (diff <= 10 ? 'grading-yellow' : ''); }

    async function addTask(pId) { const v=document.getElementById(`tIn-${pId}`).value; if(!v) return; const p=projects.find(x=>x.id===pId); p.tasks.push({id:Date.now(), text:v, done:false}); await sb.from('projects').update({tasks:p.tasks}).eq('id',pId); loadAll(true); }
    async function toggleTask(pId, tId) { const p=projects.find(x=>x.id===pId); const t=p.tasks.find(x=>x.id.toString()===tId.toString()); t.done=!t.done; await sb.from('projects').update({tasks:p.tasks}).eq('id',pId); render(); }
    async function deleteTask(pId, tId) { const p=projects.find(x=>x.id===pId); p.tasks=p.tasks.filter(x=>x.id.toString()!==tId.toString()); await sb.from('projects').update({tasks:p.tasks}).eq('id',pId); render(); }
    async function addInv(pId) { const l=document.getElementById(`iL-${pId}`).value, a=document.getElementById(`iA-${pId}`).value; if(!l||!a) return; const p=projects.find(x=>x.id===pId); p.invoices.push({id:Date.now(), label:l, amount:a.replace(/\./g,''), status:'Pending', paid_at: null}); await sb.from('projects').update({invoices:p.invoices}).eq('id',pId); loadAll(true); }
    async function toggleInvStatus(pId, iId) { 
        const p=projects.find(x=>x.id===pId); const i=p.invoices.find(x=>x.id.toString()===iId.toString()); 
        if(i.status==='Pending'){ i.status='Paid'; i.paid_at=new Date().toISOString(); } else { i.status='Pending'; i.paid_at=null; }
        await sb.from('projects').update({invoices:p.invoices}).eq('id',pId); render(); updateSummary(); 
    }
    async function deleteInv(pId, iId) { const p=projects.find(x=>x.id===pId); p.invoices=p.invoices.filter(x=>x.id.toString()!==iId.toString()); await sb.from('projects').update({invoices:p.invoices}).eq('id',pId); loadAll(true); }

    let curE = {};
    function openEditTaskModal(pId, tId) {
        const p=projects.find(x=>x.id===pId); const t=p.tasks.find(x=>x.id.toString()===tId.toString());
        curE = {pId, tId}; document.getElementById('editTaskText').value = t.text;
        openModal('editTaskModal'); document.getElementById('saveEditTaskBtn').onclick = async () => {
            t.text = document.getElementById('editTaskText').value; await sb.from('projects').update({tasks:p.tasks}).eq('id',pId); closeModal('editTaskModal'); render();
        }
    }
    function openEditInvModal(pId, iId) {
        const p=projects.find(x=>x.id===pId); const i=p.invoices.find(x=>x.id.toString()===iId.toString());
        curE = {pId, iId}; document.getElementById('editInvLabel').value = i.label; document.getElementById('editInvAmount').value = formatRupiah(i.amount);
        openModal('editInvModal'); document.getElementById('saveEditInvBtn').onclick = async () => {
            i.label = document.getElementById('editInvLabel').value; i.amount = document.getElementById('editInvAmount').value.replace(/\./g,'');
            await sb.from('projects').update({invoices:p.invoices}).eq('id',pId); closeModal('editInvModal'); loadAll(true);
        }
    }

    function openEditDocModal(id) {
        const d = documents.find(x => x.id === id);
        document.getElementById('dName').value = d.doc_name;
        document.getElementById('dClient').value = d.client;
        document.getElementById('dStart').value = d.start_date;
        document.getElementById('dEnd').value = d.end_date || '';
        document.getElementById('docModalTitle').innerText = "Edit Dokumen 📄";
        document.getElementById('saveDocBtn').onclick = async () => {
            await sb.from('client_documents').update({
                doc_name: document.getElementById('dName').value,
                client: document.getElementById('dClient').value,
                start_date: document.getElementById('dStart').value,
                end_date: document.getElementById('dEnd').value || null
            }).eq('id', id);
            closeModal('docModal'); loadAll();
        };
        document.getElementById('docModal').style.display = 'flex';
    }

    loadAll();
</script>
</body>
</html>
